[project]
name = "event-fleet"
version = "0.1.0"
description = "Conference Prep Fleet -- MCP server + coordinating agent fleet"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.40",
    "python-dotenv>=1.0",
    # HTTP/SSE front door (fleet.http_app), alongside the stdio MCP transport.
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]
